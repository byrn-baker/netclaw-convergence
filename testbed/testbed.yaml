---
# Convergence Home Lab — pyATS Testbed
# Credentials loaded from environment variables via %ENV{}

devices:
  HomeSwitch01:
    alias: "Home Switch 01"
    type: switch
    os: iosxe
    platform: cat3850
    credentials:
      default:
        username: "%ENV{SWITCH_SSH_USER}"
        password: "%ENV{SWITCH_SSH_PASS}"
      enable:
        password: "%ENV{SWITCH_SSH_ENABLE_PASS}"
    connections:
      cli:
        protocol: ssh
        ip: 192.168.3.2
        port: 22
        arguments:
          connection_timeout: 60

  HomeSwitch02:
    alias: "Home Switch 02"
    type: switch
    os: iosxe
    platform: cat3850
    credentials:
      default:
        username: "%ENV{SWITCH_SSH_USER}"
        password: "%ENV{SWITCH_SSH_PASS}"
      enable:
        password: "%ENV{SWITCH_SSH_ENABLE_PASS}"
    connections:
      cli:
        protocol: ssh
        ip: 192.168.3.3
        port: 22
        arguments:
          connection_timeout: 60
