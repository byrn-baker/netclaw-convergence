schema_version: "1.0"
preset:
  id: "netclaw-claw"
  name: "NetClaw deployment"
  version: "1.0.0"
  description: "Plan independent claws and stage native human installation review."
  author: "NetClaw"
  repository: "https://github.com/automateyournetwork/netclaw"
  license: "Apache-2.0"
requires:
  speckit_version: "==0.7.1"
provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "NetClaw deployment spec-template"
      replaces: "spec-template"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "NetClaw deployment plan-template"
      replaces: "plan-template"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "NetClaw deployment tasks-template"
      replaces: "tasks-template"
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "NetClaw deployment constitution-template"
      replaces: "constitution-template"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "NetClaw deployment speckit.specify"
      replaces: "speckit.specify"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "NetClaw deployment speckit.clarify"
      replaces: "speckit.clarify"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "NetClaw deployment speckit.plan"
      replaces: "speckit.plan"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "NetClaw deployment speckit.tasks"
      replaces: "speckit.tasks"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "NetClaw deployment speckit.analyze"
      replaces: "speckit.analyze"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "NetClaw deployment speckit.implement"
      replaces: "speckit.implement"
tags:
  - deployment
  - netclaw
