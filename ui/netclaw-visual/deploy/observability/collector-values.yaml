# Optional LAB starter for the official OpenTelemetry Collector Helm chart.
# Pin a reviewed chart version when installing. This does not deploy NetClaw.
# Receiver binds only to pod loopback: access it using kubectl port-forward.
# Before any production exposure, add TLS/authentication and network policy.
mode: deployment
replicaCount: 1
fullnameOverride: netclaw-otel
image:
  repository: otel/opentelemetry-collector-k8s
command:
  name: otelcol-k8s
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
config:
  receivers:
    jaeger: null
    prometheus: null
    zipkin: null
    otlp:
      protocols:
        grpc: null
        http:
          endpoint: 127.0.0.1:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 75
      spike_limit_percentage: 15
    batch:
      timeout: 5s
      send_batch_size: 128
  exporters:
    debug:
      verbosity: basic
  service:
    pipelines:
      logs: null
      traces: null
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
