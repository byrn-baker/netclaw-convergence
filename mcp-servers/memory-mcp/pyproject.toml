[project]
name = "netclaw-memory-mcp"
version = "0.1.0"
description = "Hybrid Memory MCP Server for NetClaw - persistent context across sessions with structured facts, semantic search, and entity relationships"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gait-ai>=0.0.9,<1",
    # Spec 141: tested modern framework; retain existing storage bounds.
    "mcp==2.3.0",
    "fastmcp==4.0.11",
    "fastmcp-tasks==4.0.11",
    "chromadb>=0.4.0,<2",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]

[project.scripts]
memory-mcp-server = "memory_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["memory_mcp_server.py", "storage", "embeddings"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
