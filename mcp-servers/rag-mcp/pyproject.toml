[project]
name = "netclaw-rag-mcp"
version = "0.1.0"
description = "NetClaw Agentic RAG Knowledge Base - offline document knowledge base with hybrid retrieval, citations, and opt-in snapshots"
requires-python = ">=3.10"
dependencies = [
    "gait-ai>=0.0.9,<1",
    "mcp==2.3.0",
    "fastmcp==4.0.11",
    "fastmcp-tasks==4.0.11",
    "chromadb>=0.4.0,<2",
    "sentence-transformers>=2.2.0,<6",
    "torch>=2.0.0,<3",
    "rank_bm25>=0.2,<1",
    "pymupdf>=1.24,<2",        # imported as `fitz` — a dist/module rename
    "beautifulsoup4>=4.12,<5",  # imported as `bs4` — a dist/module rename
    "httpx>=0.27.0,<1",
    "python-docx>=1.1,<2",      # imported as `docx`
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",      # imported as `pptx`
    "vsdx>=0.5,<1",
]

[project.scripts]
rag-mcp-server = "rag_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "rag_mcp_server.py",
    "config.py",
    "scrubber.py",
    "ingestion/",
    "retrieval/",
    "storage/",
    "embeddings/",
]

[dependency-groups]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]
