name: Release metadata

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'docs/RELEASING.md'
      - 'docs/releases/**'
      - 'scripts/prepare-release.py'
      - 'scripts/test-prepare-release.py'
      - '.github/workflows/release-metadata.yml'
  push:
    branches: [main]
    tags: ['v1.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test-prepare-release.py
      - run: python3 scripts/prepare-release.py --check
      - name: Verify tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
