<text x="85" y="360" font-size="22" fill="#bd5c15" style="fill:#bd5c15" font-weight="700" text-anchor="start" class="">AUTOMATIC ALERT — POLICY-GATED</text>
<path d="M180 400 H590" fill="none" stroke="#bd5c15" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<rect x="475" y="440" width="1470" height="95" rx="8" fill="#ffffff" stroke="#bd5c15" stroke-width="1.6"/>
<text x="500" y="474" font-size="20" fill="#152b44" style="fill:#152b44" font-weight="600" text-anchor="start" class="">Admission branch: T0 / T1 → logged case + configured notification; stop before OpenClaw.</text>
<text x="500" y="510" font-size="19" fill="#53677e" style="fill:#53677e" font-weight="400" text-anchor="start" class="">T2 allowlist + receiver budgets + duplicate/rate checks → continue below. No queued investigation backlog.</text>
<path d="M590 575 H1820" fill="none" stroke="#7950aa" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<path d="M590 650 H1000" fill="none" stroke="#bd5c15" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<text x="620" y="683" font-size="17" fill="#53677e" style="fill:#53677e" font-weight="400" text-anchor="start" class="">Alert context + device context + prior-case hits + event_id</text>
<path d="M1000 745 H1410" fill="none" stroke="#bd5c15" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<text x="1018" y="778" font-size="17" fill="#53677e" style="fill:#53677e" font-weight="400" text-anchor="start" class="">Via n2n-mcp → Border :11790; wait repeatedly for task completion</text>
<path d="M1410 820 H1530 V875 H1410" fill="none" stroke="#2864ba" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)" stroke-dasharray="8 5"/>
<text x="1550" y="874" font-size="18" fill="#53677e" style="fill:#53677e" font-weight="400" text-anchor="start" class="">Metrics / logs / device APIs / prior cases</text>
<path d="M1410 930 H1820" fill="none" stroke="#7950aa" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/>
