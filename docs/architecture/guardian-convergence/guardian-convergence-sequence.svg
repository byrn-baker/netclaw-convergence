<path d="M1410 1015 H1000" fill="none" stroke="#bd5c15" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-orange)" stroke-dasharray="8 5"/>
<path d="M2230 1075 H1820" fill="none" stroke="#2864ba" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)" stroke-dasharray="8 5"/>
<rect x="85" y="1145" width="2270" height="40" rx="6" fill="#edf5f6" stroke="#c5dadd" stroke-width="1.6"/>
<text x="105" y="1172" font-size="19" fill="#007f83" style="fill:#007f83" font-weight="400" text-anchor="start" class="">Outcome side effects: Guardian sends Discord findings and requests /snapshot → RAG. Subsequent alerts can reuse the prior-case narrative.</text>
<text x="85" y="1237" font-size="22" fill="#7950aa" style="fill:#7950aa" font-weight="700" text-anchor="start" class="">OPERATOR-REQUESTED FOLLOW-UP — DEDICATED PATH</text>
<path d="M2230 1290 H1820" fill="none" stroke="#7950aa" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<text x="1760" y="1325" font-size="17" fill="#53677e" style="fill:#53677e" font-weight="400" text-anchor="start" class="">POST /api/home/events/:id/reinvestigate via HUD API</text>
<path d="M1820 1378 H590" fill="none" stroke="#7950aa" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<path d="M590 1460 H1000" fill="none" stroke="#7950aa" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<text x="1025" y="1465" font-size="19" fill="#7950aa" style="fill:#7950aa" font-weight="400" text-anchor="start" class="">Repeat steps 04–08 with the same case ID and operator notes.</text>
<text x="85" y="1530" font-size="19" fill="#7950aa" style="fill:#7950aa" font-weight="400" text-anchor="start" class="">This route does not call the automatic T0/T1/T2 admission functions. Model work is explicitly requested by the operator.</text>
<text x="60" y="1625" font-size="18" fill="#53677e" style="fill:#53677e" font-weight="700" text-anchor="start" class="">IDENTITY + AUTHENTICATION</text>
<text x="60" y="1662" font-size="19" fill="#152b44" style="fill:#152b44" font-weight="400" text-anchor="start" class="">Fingerprint groups the alert; event_id identifies the durable case; task_id identifies a delegated run; hook session key is fingerprint-based.</text>
<text x="60" y="1694" font-size="19" fill="#152b44" style="fill:#152b44" font-weight="400" text-anchor="start" class="">Upstream case-API bearer stays in the HUD proxy; hook bearer, iN2N member authentication and OAuth model auth are distinct.</text>
<text x="60" y="1745" font-size="18" fill="#53677e" style="fill:#53677e" font-weight="400" text-anchor="start" class="">Current receiver concurrency accounting ends after hook dispatch; it is not an end-to-end reservation for the worker’s entire run.</text>
<text x="60" y="1776" font-size="18" fill="#53677e" style="fill:#53677e" font-weight="400" text-anchor="start" class="">Deployment bindings / model replies / member enrollment verified. Agent tool use, case completion and notifications follow the configured procedure.</text>
<text x="2380" y="1800" font-size="15" fill="#53677e" style="fill:#53677e" font-weight="400" text-anchor="end" class="">NETCLAW / CURRENT STATE / REV 1</text>
<text x="255.0" y="388" font-size="18" fill="#bd5c15" style="fill:#bd5c15" font-weight="600" text-anchor="start" class="edge-label">01  POST /webhook</text>
<text x="1075.0" y="563" font-size="18" fill="#7950aa" style="fill:#7950aa" font-weight="600" text-anchor="start" class="edge-label">02  POST initial case · status=investigating · keep event_id</text>
<text x="665.0" y="638" font-size="18" fill="#bd5c15" style="fill:#bd5c15" font-weight="600" text-anchor="start" class="edge-label">03  POST /hooks/alert</text>
<text x="1075.0" y="733" font-size="18" fill="#bd5c15" style="fill:#bd5c15" font-weight="600" text-anchor="start" class="edge-label">04  n2n_route → task ID</text>
<text x="1550" y="840" font-size="18" fill="#2864ba" style="fill:#2864ba" font-weight="600" text-anchor="start" class="edge-label">05  Scoped evidence queries</text>
<text x="1485.0" y="918" font-size="18" fill="#7950aa" style="fill:#7950aa" font-weight="600" text-anchor="start" class="edge-label">06  PATCH same event_id</text>
<text x="1075.0" y="1003" font-size="18" fill="#bd5c15" style="fill:#bd5c15" font-weight="600" text-anchor="start" class="edge-label">07  Task findings / terminal result</text>
<text x="1895.0" y="1063" font-size="18" fill="#2864ba" style="fill:#2864ba" font-weight="600" text-anchor="start" class="edge-label">08  GET diary / triage via HUD proxy</text>
<text x="1895.0" y="1278" font-size="18" fill="#7950aa" style="fill:#7950aa" font-weight="600" text-anchor="start" class="edge-label">09  Need More + expert_feedback</text>
<text x="1075.0" y="1366" font-size="18" fill="#7950aa" style="fill:#7950aa" font-weight="600" text-anchor="start" class="edge-label">10  Reopen original case; POST receiver /reinvestigate</text>
<text x="665.0" y="1448" font-size="18" fill="#7950aa" style="fill:#7950aa" font-weight="600" text-anchor="start" class="edge-label">11  POST /hooks/alert</text>
</svg>
