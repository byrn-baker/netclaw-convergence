{{- if .Values.speedtest.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-speedtest
data:
  run.py: |
    {{- .Files.Get "files/speedtest.py" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-speedtest
  labels: {{ include "convergence.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: speedtest}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: speedtest}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      securityContext: {runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: speedtest
          image: {{ .Values.speedtest.image }}
          command: [python, -u, /config/run.py]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - {name: PUSHGATEWAY_URL, value: 'http://{{ .Release.Name }}-pushgateway:9091'}
            - {name: SITE_LABEL, value: {{ .Values.speedtest.site | quote }}}
            - {name: SPEEDTEST_INTERVAL_SECONDS, value: {{ .Values.speedtest.intervalSeconds | quote }}}
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {cpu: '1', memory: 256Mi}}
          volumeMounts: [{name: config, mountPath: /config, readOnly: true}]
      volumes:
        - {name: config, configMap: {name: '{{ .Release.Name }}-speedtest'}}
{{- end }}
