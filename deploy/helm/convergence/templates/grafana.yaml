{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana
  labels: {{ include "convergence.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - {name: Metrics, uid: convergence-metrics, type: prometheus, access: proxy, url: 'http://{{ .Release.Name }}-metrics:8428', isDefault: true, editable: false}
      - {name: Logs, uid: convergence-loki, type: loki, access: proxy, url: 'http://{{ .Release.Name }}-loki:3100', editable: false}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Convergence
        type: file
        options: {path: /var/lib/grafana/provisioned}
  health.json: |
    {"uid":"convergence-installation","title":"Convergence installation health","schemaVersion":39,"version":1,"refresh":"30s","time":{"from":"now-30m","to":"now"},"panels":[
      {"id":1,"type":"text","title":"What this dashboard proves","gridPos":{"x":0,"y":0,"w":24,"h":4},"options":{"mode":"markdown","content":"Core collection and API reachability only. Device telemetry, IDS coverage and investigations require separate setup and verification. Missing network feeds are unknown."}},
      {"id":2,"type":"timeseries","title":"Core scrape targets (1 = up)","gridPos":{"x":0,"y":4,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"convergence-metrics"},"targets":[{"refId":"A","expr":"up","legendFormat":"{{`{{job}} / {{instance}}`}}"}]},
      {"id":3,"type":"timeseries","title":"API probe (1 = reachable)","gridPos":{"x":12,"y":4,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"convergence-metrics"},"targets":[{"refId":"A","expr":"probe_success{job=\"convergence-api\"}","legendFormat":"{{`{{site}}`}}"}]}
    ]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
  labels: {{ include "convergence.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: grafana}
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-grafana
  labels: {{ include "convergence.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-grafana
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: grafana}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsUser: 472, runAsGroup: 472, fsGroup: 472, runAsNonRoot: true}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'false'}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: 'false'}
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ required "existingSecret is required" .Values.existingSecret }}, key: GRAFANA_ADMIN_PASSWORD}
          resources: {{ toYaml .Values.grafana.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 5}
          startupProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 5, failureThreshold: 60}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: config, mountPath: /var/lib/grafana/provisioned/health.json, subPath: health.json}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-grafana}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.grafana.storage.className | quote }}
        resources: {requests: {storage: {{ .Values.grafana.storage.size | quote }}}}
{{- end }}
