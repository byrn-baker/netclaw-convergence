# Live home stack: independent collection and K3s storage. Apply only with the documented migration.
existingSecret: convergence-secrets
nodeSelector: &id001
  kubernetes.io/hostname: k3s-worker-macmini-1
siteConfig:
  home:
    name: Home
    wanInterface: wan
    deviceName: edge
    speedtestTarget: 1000000000
    thresholds:
      latency:
        green: 40
        yellow: 80
      loss:
        green: 0
        yellow: 5
      txRetries:
        green: 20
        yellow: 35
      speedtest:
        green: 900000000
        yellow: 700000000
    switches:
      match: HomeSwitch.*
      models:
        HomeSwitch01: Cisco WS-C3850-48P
        HomeSwitch02: Cisco WS-C3850-48P
        HomeSwitch04: Cisco WS-C3650-48P
    flows:
      exporters:
      - 192.168.13.1
api:
  idsEnabled: true
  image:
    tag: 6aced782
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: k3s-worker-macmini-1
  service:
    type: NodePort
    nodePort: 30081
  alertReceiverUrl: http://192.168.3.252:8099
  env:
    PUBLIC_URL: http://192.168.13.12:30081
    UNIFI_MGMT_URL: https://192.168.100.10:11443
    PFSENSE_MGMT_URL: https://192.168.13.1:440
victoria:
  nodeSelector: *id001
  metrics:
    server:
      nodeSelector: *id001
      retentionPeriod: 365d
      extraArgs:
        dedup.minScrapeInterval: 1ms
  logs:
    server:
      nodeSelector: *id001
      retentionPeriod: 365d
      persistentVolume:
        existingClaim: convergence-logs-live
  collector:
    config:
      receivers:
        syslog/devices:
          protocol: rfc3164
          location: UTC
          udp:
            listen_address: 0.0.0.0:1514
            add_attributes: true
          operators:
          - type: router
            id: vendor_router
            routes:
            - output: cisco_ios_parser
              expr: 'body != nil and body matches "^<[0-9]+>[0-9]*: ?\\*?[A-Z][a-z]{2}
                "'
            - output: filterlog_v4
              expr: attributes["appname"] == "filterlog" and attributes["message"]
                != nil and attributes["message"] matches "^([^,]*,){8}4,"
            - output: filterlog_v6
              expr: attributes["appname"] == "filterlog" and attributes["message"]
                != nil and attributes["message"] matches "^([^,]*,){8}6,"
            - output: filterlog_common
              expr: attributes["appname"] == "filterlog"
            default: noop
          - id: cisco_ios_parser
            type: regex_parser
            parse_from: body
            on_error: send
            regex: '^<(?P<priority>\d+)>(?P<sequence>\d+): \*?(?P<device_time>[A-Z][a-z]{2}
              +\d+ [\d:.]+): %(?P<mnemonic>[A-Z0-9_]+-(?P<sev_level>\d)-[A-Z0-9_]+):
              (?P<message>.*)$'
            output: noop
          - id: filterlog_v4
            type: regex_parser
            parse_from: attributes.message
            on_error: send
            regex: ^(?P<rule_nr>[^,]*),(?P<sub_rule_nr>[^,]*),(?P<anchor>[^,]*),(?P<tracker>[^,]*),(?P<fw_interface>[^,]*),(?P<reason>[^,]*),(?P<action>[^,]*),(?P<direction>[^,]*),(?P<ip_version>4),[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,[^,]*,(?P<proto_id>[^,]*),(?P<protocol>[^,]*),[^,]*,(?P<src_ip>[^,]*),(?P<dst_ip>[^,]*)(?:,(?P<src_port>[0-9]*),(?P<dst_port>[0-9]*))?
            output: noop
          - id: filterlog_v6
            type: regex_parser
            parse_from: attributes.message
            on_error: send
            regex: ^(?P<rule_nr>[^,]*),(?P<sub_rule_nr>[^,]*),(?P<anchor>[^,]*),(?P<tracker>[^,]*),(?P<fw_interface>[^,]*),(?P<reason>[^,]*),(?P<action>[^,]*),(?P<direction>[^,]*),(?P<ip_version>6),[^,]*,[^,]*,[^,]*,(?P<protocol>[^,]*),(?P<proto_id>[^,]*),[^,]*,(?P<src_ip>[^,]*),(?P<dst_ip>[^,]*)(?:,(?P<src_port>[0-9]*),(?P<dst_port>[0-9]*))?
            output: noop
          - id: filterlog_common
            type: regex_parser
            parse_from: attributes.message
            on_error: send
            regex: ^(?P<rule_nr>[^,]*),(?P<sub_rule_nr>[^,]*),(?P<anchor>[^,]*),(?P<tracker>[^,]*),(?P<fw_interface>[^,]*),(?P<reason>[^,]*),(?P<action>[^,]*),(?P<direction>[^,]*)
            output: noop
          - id: noop
            type: noop
        syslog/devices_tcp:
          protocol: rfc3164
          location: UTC
          tcp:
            listen_address: 0.0.0.0:1514
            add_attributes: true
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        snmp/homeswitch01:
          collection_interval: 60s
          initial_delay: 0s
          endpoint: udp://192.168.3.2:161
          version: v2c
          community: ${env:SNMP_COMMUNITY}
          timeout: 30s
          resource_attributes:
            interface.name:
              oid: 1.3.6.1.2.1.2.2.1.2
          metrics:
            interface.octets.in:
              unit: By
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.31.1.1.1.6
                resource_attributes:
                - interface.name
            interface.octets.out:
              unit: By
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.31.1.1.1.10
                resource_attributes:
                - interface.name
            interface.errors.in:
              unit: '{errors}'
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.14
                resource_attributes:
                - interface.name
            interface.errors.out:
              unit: '{errors}'
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.20
                resource_attributes:
                - interface.name
            interface.status:
              unit: '{state}'
              gauge:
                value_type: int
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.8
                resource_attributes:
                - interface.name
            interface.admin.status:
              unit: '{state}'
              gauge:
                value_type: int
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.7
                resource_attributes:
                - interface.name
        snmp/homeswitch02:
          collection_interval: 60s
          initial_delay: 5s
          endpoint: udp://192.168.3.3:161
          version: v2c
          community: ${env:SNMP_COMMUNITY}
          timeout: 30s
          resource_attributes:
            interface.name:
              oid: 1.3.6.1.2.1.2.2.1.2
          metrics:
            interface.octets.in:
              unit: By
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.31.1.1.1.6
                resource_attributes:
                - interface.name
            interface.octets.out:
              unit: By
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.31.1.1.1.10
                resource_attributes:
                - interface.name
            interface.errors.in:
              unit: '{errors}'
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.14
                resource_attributes:
                - interface.name
            interface.errors.out:
              unit: '{errors}'
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.20
                resource_attributes:
                - interface.name
            interface.status:
              unit: '{state}'
              gauge:
                value_type: int
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.8
                resource_attributes:
                - interface.name
            interface.admin.status:
              unit: '{state}'
              gauge:
                value_type: int
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.7
                resource_attributes:
                - interface.name
        snmp/homeswitch04:
          collection_interval: 60s
          initial_delay: 10s
          endpoint: udp://192.168.3.5:161
          version: v2c
          community: ${env:SNMP_COMMUNITY}
          timeout: 30s
          resource_attributes:
            interface.name:
              oid: 1.3.6.1.2.1.2.2.1.2
          metrics:
            interface.octets.in:
              unit: By
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.31.1.1.1.6
                resource_attributes:
                - interface.name
            interface.octets.out:
              unit: By
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.31.1.1.1.10
                resource_attributes:
                - interface.name
            interface.errors.in:
              unit: '{errors}'
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.14
                resource_attributes:
                - interface.name
            interface.errors.out:
              unit: '{errors}'
              sum:
                value_type: int
                aggregation: cumulative
                monotonic: true
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.20
                resource_attributes:
                - interface.name
            interface.status:
              unit: '{state}'
              gauge:
                value_type: int
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.8
                resource_attributes:
                - interface.name
            interface.admin.status:
              unit: '{state}'
              gauge:
                value_type: int
              column_oids:
              - oid: 1.3.6.1.2.1.2.2.1.7
                resource_attributes:
                - interface.name
        prometheus/ids:
          config:
            scrape_configs:
            - job_name: netclaw-ids
              scrape_interval: 30s
              scrape_timeout: 10s
              scheme: https
              metrics_path: /metrics
              bearer_token: ${env:IDS_STATUS_TOKEN}
              tls_config:
                ca_file: /run/secrets/ids-ca.crt
              static_configs:
              - targets:
                - ${env:IDS_METRICS_TARGET}
      processors:
        transform/device_identity:
          error_mode: ignore
          log_statements:
          - context: log
            statements:
            - set(attributes["device_name"], "HomeSwitch01") where attributes["net.peer.ip"]
              == "192.168.3.2"
            - set(attributes["device_name"], "HomeSwitch02") where attributes["net.peer.ip"]
              == "192.168.3.3"
            - set(attributes["device_name"], "HomeSwitch04") where attributes["net.peer.ip"]
              == "192.168.3.5"
            - set(attributes["device_name"], "pfsense")      where attributes["net.peer.ip"]
              == "192.168.3.1"
            - set(attributes["device_name"], attributes["hostname"]) where attributes["device_name"]
              == nil and attributes["hostname"] != nil
            - set(attributes["device_name"], attributes["net.peer.ip"]) where attributes["device_name"]
              == nil and attributes["net.peer.ip"] != nil
            - set(attributes["device_ip"], attributes["net.peer.ip"]) where attributes["net.peer.ip"]
              != nil
        transform/receive_time:
          error_mode: ignore
          log_statements:
          - context: log
            statements:
            - set(time, observed_time)
        transform/clean_body:
          error_mode: ignore
          log_statements:
          - context: log
            statements:
            - set(body, attributes["message"]) where attributes["message"] != nil
            - set(attributes["protocol"], ConvertCase(attributes["protocol"], "lower"))
              where attributes["protocol"] != nil
        groupbyattrs/device:
          keys:
          - device_name
          - device_ip
        resource/devices:
          attributes:
          - key: site
            value: home
            action: upsert
          - key: service.name
            value: device-syslog
            action: upsert
          - key: loki.resource.labels
            value: device_name,site,service.name
            action: insert
        batch:
          timeout: 5s
          send_batch_size: 1024
          send_batch_max_size: 2048
        memory_limiter:
          check_interval: 5s
          limit_percentage: 75
          spike_limit_percentage: 15
        resource/homeswitch01:
          attributes:
          - key: service.name
            value: device_snmp
            action: upsert
          - key: service.instance.id
            value: 192.168.3.2
            action: upsert
          - key: device_name
            value: HomeSwitch01
            action: upsert
          - key: role
            value: switch
            action: upsert
          - key: vendor
            value: cisco
            action: upsert
          - key: site
            value: home
            action: upsert
        resource/homeswitch02:
          attributes:
          - key: service.name
            value: device_snmp
            action: upsert
          - key: service.instance.id
            value: 192.168.3.3
            action: upsert
          - key: device_name
            value: HomeSwitch02
            action: upsert
          - key: role
            value: switch
            action: upsert
          - key: vendor
            value: cisco
            action: upsert
          - key: site
            value: home
            action: upsert
        resource/homeswitch04:
          attributes:
          - key: service.name
            value: device_snmp
            action: upsert
          - key: service.instance.id
            value: 192.168.3.5
            action: upsert
          - key: device_name
            value: HomeSwitch04
            action: upsert
          - key: role
            value: switch
            action: upsert
          - key: vendor
            value: cisco
            action: upsert
          - key: site
            value: home
            action: upsert
      exporters:
        loki:
          endpoint: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push
          timeout: 30s
          retry_on_failure:
            enabled: true
          sending_queue:
            enabled: true
            storage: file_storage/otel
        otlphttp/victorialogs:
          logs_endpoint: http://{{ .Release.Name }}-logs:9428/insert/opentelemetry/v1/logs
          tls:
            insecure: true
          timeout: 30s
          retry_on_failure:
            enabled: true
          sending_queue:
            enabled: true
            storage: file_storage/otel
        prometheusremotewrite/victoriametrics:
          endpoint: http://{{ .Release.Name }}-metrics:8428/api/v1/write
          resource_to_telemetry_conversion:
            enabled: true
          timeout: 30s
          retry_on_failure:
            enabled: true
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
        file_storage/otel:
          directory: /data
          timeout: 10s
      service:
        extensions:
        - health_check
        - file_storage/otel
        telemetry:
          metrics:
            address: 0.0.0.0:8888
          logs:
            level: info
        pipelines:
          logs/devices:
            receivers:
            - syslog/devices
            - syslog/devices_tcp
            processors:
            - memory_limiter
            - transform/device_identity
            - transform/receive_time
            - transform/clean_body
            - groupbyattrs/device
            - resource/devices
            - batch
            exporters:
            - loki
            - otlphttp/victorialogs
          logs/otlp:
            receivers:
            - otlp
            processors:
            - memory_limiter
            - batch
            exporters:
            - loki
            - otlphttp/victorialogs
          metrics/otlp:
            receivers:
            - otlp
            processors:
            - memory_limiter
            - batch
            exporters:
            - prometheusremotewrite/victoriametrics
          metrics/homeswitch01:
            receivers:
            - snmp/homeswitch01
            processors:
            - memory_limiter
            - resource/homeswitch01
            - batch
            exporters:
            - prometheusremotewrite/victoriametrics
          metrics/homeswitch02:
            receivers:
            - snmp/homeswitch02
            processors:
            - memory_limiter
            - resource/homeswitch02
            - batch
            exporters:
            - prometheusremotewrite/victoriametrics
          metrics/homeswitch04:
            receivers:
            - snmp/homeswitch04
            processors:
            - memory_limiter
            - resource/homeswitch04
            - batch
            exporters:
            - prometheusremotewrite/victoriametrics
          metrics/ids:
            receivers:
            - prometheus/ids
            processors:
            - memory_limiter
            - batch
            exporters:
            - prometheusremotewrite/victoriametrics
    extraServicePorts:
    - name: syslog-udp
      port: 1514
      targetPort: 1514
      protocol: UDP
    - name: syslog-tcp
      port: 1514
      targetPort: 1514
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: 8888
    service:
      type: NodePort
      nodePort: 30318
      grpcNodePort: 30317
    envFrom:
    - secretRef:
        name: convergence-collector-secrets
    extraVolumes:
    - name: ids-ca
      secret:
        secretName: convergence-secrets
        items:
        - key: ids-ca.crt
          path: ids-ca.crt
    extraVolumeMounts:
    - name: ids-ca
      mountPath: /run/secrets
      readOnly: true
  agent:
    extraScrapeConfigs:
    - job_name: convergence-api
      scrape_interval: 30s
      metrics_path: /probe
      params:
        module:
        - http_2xx
      static_configs:
      - targets:
        - http://{{ .Release.Name }}-api:3000/healthz
        labels:
          site: home
          service: convergence-api
      relabel_configs:
      - source_labels:
        - __address__
        target_label: __param_target
      - source_labels:
        - __param_target
        target_label: instance
      - target_label: __address__
        replacement: '{{ .Release.Name }}-blackbox:9115'
    - job_name: blackbox_wan_tcp
      scrape_interval: 30s
      metrics_path: /probe
      params:
        module:
        - tcp_connect
      static_configs:
      - targets:
        - 1.1.1.1:443
        - 8.8.8.8:443
        - 9.9.9.9:443
        labels:
          site: home
      relabel_configs:
      - source_labels:
        - __address__
        target_label: __param_target
      - source_labels:
        - __param_target
        target_label: instance
      - source_labels:
        - __param_target
        target_label: target
      - target_label: __address__
        replacement: '{{ .Release.Name }}-blackbox:9115'
    - job_name: blackbox_wan_http
      scrape_interval: 60s
      metrics_path: /probe
      params:
        module:
        - http_2xx
      static_configs:
      - targets:
        - https://www.cloudflare.com
        - https://www.google.com
        labels:
          site: home
      relabel_configs:
      - source_labels:
        - __address__
        target_label: __param_target
      - source_labels:
        - __param_target
        target_label: instance
      - target_label: __address__
        replacement: '{{ .Release.Name }}-blackbox:9115'
    - job_name: unifi
      scrape_interval: 30s
      metrics_path: /metrics
      static_configs:
      - targets:
        - '{{ .Release.Name }}-unifi:9899'
        labels:
          site: home
    - job_name: pushgateway
      scrape_interval: 60s
      honor_labels: true
      static_configs:
      - targets:
        - '{{ .Release.Name }}-pushgateway:9091'
        labels:
          site: home
    - job_name: netclaw-openclaw
      scrape_interval: 30s
      metrics_path: /metrics
      static_configs:
      - targets:
        - 192.168.3.252:9110
        labels:
          site: home
          instance: netclaw
    - job_name: otel-collector
      scrape_interval: 30s
      metrics_path: /metrics
      static_configs:
      - targets:
        - '{{ .Release.Name }}-collector:8888'
        labels:
          site: home
          instance: otel-collector
    - job_name: promtail
      scrape_interval: 30s
      metrics_path: /metrics
      static_configs:
      - targets:
        - 192.168.3.252:9080
        labels:
          site: home
          instance: promtail
    - job_name: netclaw-alert-receiver
      scrape_interval: 30s
      metrics_path: /metrics
      static_configs:
      - targets:
        - 192.168.3.252:8099
        labels:
          site: home
          instance: alert-receiver
    - job_name: blackbox_edge
      scrape_interval: 30s
      metrics_path: /probe
      params:
        module:
        - http_2xx
      static_configs:
      - targets:
        - https://192.168.13.1:440
        labels:
          site: home
          device_name: pfsense
          role: firewall
      relabel_configs:
      - source_labels:
        - __address__
        target_label: __param_target
      - source_labels:
        - __param_target
        target_label: instance
      - target_label: __address__
        replacement: '{{ .Release.Name }}-blackbox:9115'
  sharedGrafana:
    enabled: true
    extraDatasources:
    - name: '{{ .Release.Namespace }}/{{ .Release.Name }} / Loki'
      uid: '{{ include "victoria-stack.uid" . }}-loki'
      type: loki
      access: proxy
      url: http://{{ .Release.Name }}-loki.{{ .Release.Namespace }}.svc.cluster.local:3100
      isDefault: false
      editable: false
      jsonData:
        netclawAlias: loki
  alerting:
    ruleFiles:
      device.rules.yml:
        groups:
        - name: netclaw-convergence.device
          interval: 30s
          rules:
          - alert: DeviceSnmpStale
            expr: 'max by (device_name, site) (count_over_time(interface_status{job="device_snmp"}[24h]))

              unless on(device_name, site)

              max by (device_name, site) (count_over_time(interface_status{job="device_snmp"}[5m]))

              '
            for: 5m
            labels:
              severity: warning
              site: home
              investigate: 'true'
            annotations:
              summary: Device SNMP data is stale ({{ $labels.device_name }})
              description: No fresh SNMP metrics for device_name={{ $labels.device_name
                }} in over 5 minutes. Check the collector (`docker logs netclaw-convergence-otel-collector-1`),
                SNMP_COMMUNITY, and device reachability. Collector-wide failure shows
                as up{job="otel-collector"}==0.
          - alert: SwitchIdlePortsPresent
            expr: "count by (device_name, instance, site) (\n  interface_status{job=\"\
              device_snmp\",role=\"switch\"} == 2\n  and on(instance, interface_name,\
              \ device_name)\n  interface_admin_status{job=\"device_snmp\",role=\"\
              switch\"} == 1\n) > 0\n"
            for: 30m
            labels:
              severity: info
              site: home
              investigate: 'false'
              cardinality: high
            annotations:
              summary: Idle admin-up ports on {{ $labels.device_name }} ({{ $value
                }})
              description: "{{ $value }} interfaces on {{ $labels.device_name }} are\
                \ admin-up but oper-down. Expected for unused ports \u2014 dashboard\
                \ only (investigate=false)."
          - alert: SwitchLinkLost
            expr: "(\n  interface_status{job=\"device_snmp\",role=\"switch\"} == 2\n\
              \  and on(instance, interface_name, device_name)\n  interface_admin_status{job=\"\
              device_snmp\",role=\"switch\"} == 1\n)\nand on(instance, interface_name,\
              \ device_name)\n(\n  interface_status{job=\"device_snmp\",role=\"switch\"\
              } offset 15m == 1\n)\n"
            for: 3m
            labels:
              severity: warning
              site: home
              investigate: 'true'
            annotations:
              summary: Link lost on {{ $labels.device_name }} {{ $labels.interface_name
                }}
              description: Interface {{ $labels.interface_name }} was oper-up 15m
                ago and is now down while still admin-up, on device_name={{ $labels.device_name
                }} instance={{ $labels.instance }}. Admin-shut ports are excluded
                by the interface_admin_status term.
          - alert: SwitchInterfaceErrorsHigh
            expr: "sum by (device_name, instance, site) (\n  rate(interface_errors_in_total{job=\"\
              device_snmp\",role=\"switch\"}[5m])\n  + rate(interface_errors_out_total{job=\"\
              device_snmp\",role=\"switch\"}[5m])\n) > 5\n"
            for: 10m
            labels:
              severity: warning
              site: home
              investigate: 'true'
            annotations:
              summary: High interface error rate on {{ $labels.device_name }}
              description: "Aggregate in+out IF-MIB error rate \u2248 {{ $value |\
                \ humanize }} /s on device_name={{ $labels.device_name }} instance={{\
                \ $labels.instance }} for 10m. Open the Network board \u2192 Campus\
                \ switching (Grafana :3300) and filter by device_name \u2014 series\
                \ are named via interface_name (ifDescr/ifName). Aggregated by device\
                \ only (no per-ifIndex alert) to avoid storms."
          - alert: NetclawAgentMetricsDown
            expr: up{job="netclaw-openclaw"} == 0
            for: 15m
            labels:
              severity: info
              site: home
              investigate: 'false'
            annotations:
              summary: NetClaw agent metrics exporter not scraping
              description: Job netclaw-openclaw is down. Enable openclaw-token-exporter
                on the host (scripts/openclaw-metrics) or ignore if agent observability
                is disabled.
          - alert: SyslogIngestRefusing
            expr: rate(otelcol_receiver_refused_log_records{job="otel-collector"}[10m])
              > 0
            for: 10m
            labels:
              severity: warning
              site: home
              investigate: 'false'
            annotations:
              summary: OTel Collector is refusing log records
              description: "otelcol_receiver_refused_log_records is increasing ({{\
                \ $value | humanize }}/s) on receiver {{ $labels.receiver }} \u2014\
                \ records are arriving and being rejected rather than stored. Check\
                \ `docker logs netclaw-convergence-otel-collector-1` and `deploy/convergence/otel/otel-config.yaml`."
          - alert: LogExportFailing
            expr: rate(otelcol_exporter_send_failed_log_records{job="otel-collector"}[10m])
              > 0
            for: 10m
            labels:
              severity: warning
              site: home
              investigate: 'false'
            annotations:
              summary: Log export failing to {{ $labels.exporter }}
              description: otelcol_exporter_send_failed_log_records is increasing
                on exporter {{ $labels.exporter }}. Logs are being received but not
                stored. The persistent send queue absorbs short outages; sustained
                failure means Loki or VictoriaLogs is unreachable or rejecting writes.
          - alert: SyslogIngestNoEntries
            expr: 'up{job="otel-collector"} == 1

              and on() sum(increase(otelcol_receiver_accepted_log_records{job="otel-collector"}[1h]))
              == 0

              '
            for: 1h
            labels:
              severity: info
              site: home
              investigate: 'false'
            annotations:
              summary: No syslog entries ingested in the last hour
              description: "The collector is up but has accepted zero log records\
                \ for 1h. Expected on a site with no device syslog configured yet\
                \ \u2014 see the generated device config checklist for the syslog\
                \ destination host:port."
          - alert: LogIngestDown
            expr: up{job="otel-collector"} == 0
            for: 15m
            labels:
              severity: info
              site: home
              investigate: 'false'
            annotations:
              summary: OTel Collector not scraping
              description: Job otel-collector is down, so device syslog is not reaching
                Loki or VictoriaLogs. Enable the full or device-syslog compose profile.
          - alert: HostLogShipDown
            expr: up{job="promtail"} == 0
            for: 15m
            labels:
              severity: info
              site: home
              investigate: 'false'
            annotations:
              summary: Promtail host log ship not scraping
              description: Job promtail is down, so OpenClaw file logs and the systemd
                journal are not reaching Loki. Device syslog is unaffected (OTel Collector).
      home.rules.yml:
        groups:
        - name: netclaw-convergence.recording
          interval: 15s
          rules:
          - record: convergence:wan_loss_ratio:5m
            expr: 1 - avg(avg_over_time(probe_success{job="blackbox_wan_tcp"}[5m]))
            labels:
              site: home
          - record: convergence:wan_latency_ms:avg
            expr: 1000 * avg(probe_duration_seconds{job="blackbox_wan_tcp"})
            labels:
              site: home
          - record: convergence:health_score
            expr: "clamp_min(\n  100\n  - 45 * (1 - avg(avg_over_time(probe_success{job=\"\
              blackbox_wan_tcp\"}[5m])))\n  - clamp_max(1000 * avg(probe_duration_seconds{job=\"\
              blackbox_wan_tcp\"}) / 4, 25)\n, 0)\n"
            labels:
              site: home
        - name: netclaw-convergence.alerts
          rules:
          - alert: WanHardDown
            expr: max(probe_success{job=~"blackbox_wan_.*"}) == 0
            for: 2m
            labels:
              severity: critical
              site: home
              investigate: 'true'
            annotations:
              summary: WAN hard down (all probes failing)
              description: No WAN probe has succeeded for 2m from the Convergence
                stack. Check ISP, edge firewall, and blackbox_wan_* targets.
          - alert: InternetDown
            expr: max(probe_success{job=~"blackbox_wan_.*"}) == 0
            for: 2m
            labels:
              severity: critical
              site: home
              investigate: 'true'
            annotations:
              summary: Internet appears DOWN (all WAN probes failing)
              description: No WAN probe has succeeded for 2m from the Convergence
                stack vantage point.
          - alert: WanTargetUnreachable
            expr: probe_success{job="blackbox_wan_tcp"} == 0
            for: 5m
            labels:
              severity: warning
              site: home
              investigate: 'true'
            annotations:
              summary: WAN target {{ $labels.target }} unreachable
              description: TCP probe to {{ $labels.instance }} has failed for 5m.
          - alert: WanHighLatency
            expr: 1000 * avg(probe_duration_seconds{job="blackbox_wan_tcp"}) > 80
            for: 5m
            labels:
              severity: warning
              site: home
              investigate: 'false'
            annotations:
              summary: WAN latency elevated
              description: Average WAN TCP probe duration > 80ms for 5m. Dashboard/observe
                by default (investigate=false) to avoid chatty T2.
          - alert: UniFiExporterDown
            expr: up{job="unifi"} == 0
            for: 5m
            labels:
              severity: warning
              site: home
              investigate: 'true'
            annotations:
              summary: UniFi exporter not scraping
              description: Prometheus cannot reach unifi-exporter:9899. Enable profile
                unifi or fix UNIFI_* env.
          - alert: ConvergenceApiDown
            expr: probe_success{job="convergence-api"} == 0
            for: 2m
            labels:
              severity: critical
              site: home
              investigate: 'true'
            annotations:
              summary: convergence-api unreachable
              description: Blackbox HTTP probe of convergence-api /healthz is failing.
          - alert: EdgeMgmtUnreachable
            expr: probe_success{job="blackbox_edge"} == 0
            for: 5m
            labels:
              severity: warning
              site: home
              investigate: 'true'
            annotations:
              summary: Edge management UI unreachable ({{ $labels.device_name }})
              description: Blackbox HTTP probe of edge mgmt target {{ $labels.instance
                }} failed for 5m (device_name={{ $labels.device_name }}). Check pfSense/firewall
                admin HTTPS.
      ids.rules.yml:
        groups:
        - name: netclaw-convergence.ids
          interval: 30s
          rules:
          - alert: IDSIPContextUnavailable
            expr: netclaw_ids_ip_context_ready == 0
            for: 15m
            labels:
              severity: warning
              investigate: 'false'
            annotations:
              summary: IDS public-IP database is unavailable, stale or failed to reload
          - alert: IDSSensorStale
            expr: time() - netclaw_ids_sensor_last_seen_timestamp_seconds > 120
            for: 2m
            labels:
              severity: warning
              investigate: 'false'
            annotations:
              summary: IDS sensor heartbeat is stale ({{ $labels.sensor }})
          - alert: IDSCaptureStatsStale
            expr: time() - netclaw_ids_stats_timestamp_seconds > 120
            for: 2m
            labels:
              severity: warning
              investigate: 'false'
            annotations:
              summary: IDS capture statistics are stale ({{ $labels.sensor }})
          - alert: IDSMirrorSourceMissing
            expr: netclaw_ids_source_active == 0
            for: 5m
            labels:
              severity: warning
              investigate: 'false'
            annotations:
              summary: IDS mirror source lacks recent packets ({{ $labels.source }})
          - alert: IDSDeliveryBacklog
            expr: "(netclaw_ids_delivery_oldest_age_seconds{destination!=\"victorialogs\"\
              } > 300)\nor (netclaw_ids_delivery_oldest_age_seconds{destination=\"\
              victorialogs\"} > 300\n    unless on() (netclaw_ids_archive_backfill_active\
              \ == 1))\n"
            for: 5m
            labels:
              severity: warning
              investigate: 'false'
            annotations:
              summary: IDS delivery is behind ({{ $labels.destination }}, {{ $labels.sensor
                }})
          - alert: IDSCapturePacketLoss
            expr: rate(netclaw_ids_capture_drops_total[5m]) / clamp_min(rate(netclaw_ids_capture_packets_total[5m]),
              1) > 0.01
            for: 5m
            labels:
              severity: warning
              investigate: 'false'
            annotations:
              summary: IDS sensor is missing over 1% of mirrored packets ({{ $labels.sensor
                }})
          - alert: IDSDeliveryStalled
            expr: '(sum by (destination) (netclaw_ids_delivery_pending_events) > 0)

              and on(destination) (time() - netclaw_ids_delivery_last_success_timestamp_seconds
              > 300)

              '
            for: 2m
            labels:
              severity: warning
              investigate: 'false'
            annotations:
              summary: IDS destination has stopped acknowledging data ({{ $labels.destination
                }})
          - alert: IDSMetricsScrapeFailed
            expr: up{job="netclaw-ids"} == 0
            for: 2m
            labels:
              severity: warning
              investigate: 'false'
            annotations:
              summary: IDS telemetry collector cannot scrape ingest metrics
    alertmanagerConfig:
      route:
        receiver: netclaw
        group_by:
        - alertname
        - device_name
        - instance
        - severity
        group_wait: 45s
        group_interval: 5m
        repeat_interval: 4h
        routes:
        - matchers:
          - investigate="false"
          receiver: netclaw
          group_by:
          - alertname
          - device_name
          group_wait: 2m
          group_interval: 30m
          repeat_interval: 12h
          continue: false
        - matchers:
          - severity="info"
          receiver: netclaw
          group_by:
          - alertname
          - device_name
          group_wait: 2m
          group_interval: 30m
          repeat_interval: 12h
          continue: false
      receivers:
      - name: netclaw
        webhook_configs:
        - url: http://192.168.3.252:8099/webhook
          send_resolved: true
          http_config:
            authorization:
              type: Bearer
              credentials_file: /run/secrets/receiver-token
    extraVolumes:
    - name: receiver-token
      secret:
        secretName: convergence-secrets
        items:
        - key: ALERT_RECEIVER_TOKEN
          path: receiver-token
    extraVolumeMounts:
    - name: receiver-token
      mountPath: /run/secrets
      readOnly: true
queryAccess:
  enabled: true
loki:
  storage:
    existingClaim: convergence-loki-live
  service:
    type: NodePort
    nodePort: 30310
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '4'
      memory: 2Gi
ids:
  enabled: true
  existingSecret: convergence-ids-secrets
  existingClaim: convergence-ids-live
  image:
    repository: netclaw-ids-ingest
    tag: 20261030-prune2
  service:
    type: NodePort
    nodePort: 30445
unifi:
  enabled: true
  controllerUrl: https://192.168.100.10:11443
blackbox:
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
          valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
          valid_status_codes:
          - 200
          - 301
          - 302
          - 401
          - 403
          method: GET
          tls_config:
            insecure_skip_verify: true
      tcp_connect:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: ip4
      icmp_ping:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: ip4
speedtest:
  enabled: true
flowLogs:
  enabled: true
  config:
    extensions:
      file_storage:
        directory: /var/lib/netclaw-flow-logs
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      filelog/flows:
        include:
        - /var/log/pods/observability_goflow2-*/goflow2/*.log
        start_at: beginning
        include_file_path: true
        storage: file_storage
        max_log_size: 64KiB
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
        operators:
        - type: container
          max_log_size: 65536
        - type: filter
          expr: attributes["log.iostream"] == "stderr"
        - type: json_parser
          parse_from: body
          parse_to: attributes
          on_error: drop
        - type: filter
          expr: not (attributes.sampler_address in ["192.168.13.1"])
        - type: filter
          expr: attributes.src_addr == nil or attributes.dst_addr == nil or attributes.bytes
            == nil
        resource:
          job: netflow
          site: home
          service.name: netclaw-flow-logs
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 180
        spike_limit_mib: 32
      batch:
        timeout: 5s
        send_batch_size: 256
        send_batch_max_size: 512
    exporters:
      otlphttp/flows:
        logs_endpoint: http://{{ .Release.Name }}-logs:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Stream-Fields: job,site,sampler_address
        timeout: 15s
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 1000
          num_consumers: 2
    service:
      extensions:
      - file_storage
      - health_check
      pipelines:
        logs:
          receivers:
          - filelog/flows
          processors:
          - memory_limiter
          - batch
          exporters:
          - otlphttp/flows
  stateDirectory: /var/lib/netclaw-flow-logs
