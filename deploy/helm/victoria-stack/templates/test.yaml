apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-smoke-script
  labels: {{ include "victoria-stack.labels" . | nindent 4 }}
data:
  smoke.py: |
    {{- .Files.Get "files/smoke.py" | nindent 4 }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke
  annotations:
    helm.sh/hook: test
    # Keep the single completed pod until the next test so Helm 3 --logs can read it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: smoke
      image: python:3.12-alpine
      command: [python, /scripts/smoke.py]
      securityContext: {runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      env:
        - {name: RELEASE_NAME, value: {{ .Release.Name | quote }}}
        - {name: RELEASE_NAMESPACE, value: {{ .Release.Namespace | quote }}}
      resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
      volumeMounts: [{name: scripts, mountPath: /scripts, readOnly: true}]
  volumes: [{name: scripts, configMap: {name: '{{ .Release.Name }}-smoke-script'}}]
