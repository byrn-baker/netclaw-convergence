groups:
  - name: netclaw-convergence.ids
    interval: 30s
    rules:
      - alert: IDSSensorStale
        expr: time() - netclaw_ids_sensor_last_seen_timestamp_seconds > 120
        for: 2m
        labels: {severity: warning, investigate: "false"}
        annotations:
          summary: "IDS sensor heartbeat is stale ({{ $labels.sensor }})"
      - alert: IDSCaptureStatsStale
        expr: time() - netclaw_ids_stats_timestamp_seconds > 120
        for: 2m
        labels: {severity: warning, investigate: "false"}
        annotations:
          summary: "IDS capture statistics are stale ({{ $labels.sensor }})"
      - alert: IDSMirrorSourceMissing
        expr: netclaw_ids_source_active == 0
        for: 5m
        labels: {severity: warning, investigate: "false"}
        annotations:
          summary: "IDS mirror source lacks recent packets ({{ $labels.source }})"
      - alert: IDSDeliveryBacklog
        expr: |
          (netclaw_ids_delivery_oldest_age_seconds{destination!="victorialogs"} > 300)
          or (netclaw_ids_delivery_oldest_age_seconds{destination="victorialogs"} > 300
              unless on() (netclaw_ids_archive_backfill_active == 1))
        for: 5m
        labels: {severity: warning, investigate: "false"}
        annotations:
          summary: "IDS delivery is behind ({{ $labels.destination }}, {{ $labels.sensor }})"
      - alert: IDSCapturePacketLoss
        expr: rate(netclaw_ids_capture_drops_total[5m]) / clamp_min(rate(netclaw_ids_capture_packets_total[5m]), 1) > 0.01
        for: 5m
        labels: {severity: warning, investigate: "false"}
        annotations:
          summary: "IDS sensor is missing over 1% of mirrored packets ({{ $labels.sensor }})"
      - alert: IDSDeliveryStalled
        expr: |
          (sum by (destination) (netclaw_ids_delivery_pending_events) > 0)
          and on(destination) (time() - netclaw_ids_delivery_last_success_timestamp_seconds > 300)
        for: 2m
        labels: {severity: warning, investigate: "false"}
        annotations:
          summary: "IDS destination has stopped acknowledging data ({{ $labels.destination }})"
      - alert: IDSMetricsScrapeFailed
        expr: up{job="netclaw-ids"} == 0
        for: 2m
        labels: {severity: warning, investigate: "false"}
        annotations:
          summary: "IDS telemetry collector cannot scrape ingest metrics"
